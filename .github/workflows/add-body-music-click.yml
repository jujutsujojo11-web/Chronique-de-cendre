name: Add body click music fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-music-fallback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add click-to-play fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chroniques-des-cendres-1.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* BODY CLICK MUSIC FALLBACK */'
          if marker not in s:
              script = r'''<script>
// BODY CLICK MUSIC FALLBACK
// Lance la musique au premier clic sur la page.
document.body.addEventListener('click', function () {
    const musique = document.getElementById('bgAudio');
    if (musique && musique.paused) {
        musique.play().catch(function (e) {
            console.warn('Lecture audio bloquée :', e);
        });
    }
}, { once: true });
</script>'''
              s = s.replace('</body>', script + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chroniques-des-cendres-1.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add first-click music playback fallback"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/add-body-music-click.yml
          git add .github/workflows/add-body-music-click.yml
          git commit -m "Remove temporary music fallback workflow" || true
          git push || true
