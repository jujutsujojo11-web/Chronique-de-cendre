name: Fix music playback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-music:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair music player
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('chroniques-des-cendres-1.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<audio[^>]*id=["\']bgAudio["\'][^>]*>.*?</audio>', '<audio id="bgAudio" src="./Odysseus.mp3" loop preload="auto"></audio>', s, flags=re.I|re.S)
          fix = r'''<script>
          (() => {
            const audio = document.getElementById('bgAudio');
            const button = document.querySelector('.music-toggle');
            if (!audio || !button) return;
            audio.src = './Odysseus.mp3';
            audio.loop = true;
            audio.preload = 'auto';
            audio.volume = 0.45;
            const start = async () => {
              try { await audio.play(); button.textContent = '🔊'; button.setAttribute('aria-label','Couper la musique'); }
              catch (e) { console.warn('Musique bloquée:', e); }
            };
            const stop = () => { audio.pause(); button.textContent = '🎵'; button.setAttribute('aria-label','Activer la musique'); };
            button.addEventListener('click', async (e) => {
              e.preventDefault();
              if (audio.paused) await start(); else stop();
            });
            audio.addEventListener('error', () => console.error('Impossible de charger ./Odysseus.mp3', audio.error));
          })();
          </script>'''
          if 'Impossible de charger ./Odysseus.mp3' not in s:
              s = s.replace('</body>', fix + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chroniques-des-cendres-1.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make background music button reliably play audio"
            git push
          fi

      - name: Remove this workflow
        run: |
          rm -f .github/workflows/fix-music-2.yml
          git add .github/workflows/fix-music-2.yml
          git commit -m "Remove temporary music repair workflow" || true
          git push || true
