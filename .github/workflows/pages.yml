name: Deploy Chroniques des Cendres

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp chroniques-des-cendres-1.html _site/chroniques-des-cendres-1.html
          cp Odysseus.mp3 _site/Odysseus.mp3
          touch _site/.nojekyll
          # A GitHub Pages 404 should still return the game entry point.
          cp index.html _site/404.html
          test -f _site/index.html
          test -f _site/chroniques-des-cendres-1.html
          test -f _site/Odysseus.mp3

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
