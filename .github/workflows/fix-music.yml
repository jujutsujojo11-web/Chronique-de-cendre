name: Fix background music

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-music:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix audio filename and music startup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chroniques-des-cendres-1.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="odysseus.mp3"', 'src="Odysseus.mp3"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chroniques-des-cendres-1.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix background music audio path"
            git push
          fi

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-music.yml
          git add .github/workflows/fix-music.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary music fix workflow"
          git push
